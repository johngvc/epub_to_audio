[project]
name = "audiobook"
version = "0.1.0"
description = "EPUB-to-audiobook pipeline (Claude Sonnet 4.6 + Chatterbox TTS)"
requires-python = ">=3.12"
dependencies = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "pysbd>=0.3",
    "markdownify>=0.12",
    "mutagen>=1.47",
    "soundfile>=0.12",
    "numpy>=1.26",
    "rich>=13.7",
]

[project.optional-dependencies]
render = [
    "torch>=2.3",
    "chatterbox-tts>=0.1.0",
    # chatterbox-tts pulls in `perth`, which imports `pkg_resources`.
    # setuptools>=81 dropped `pkg_resources` from the wheel — pin below that.
    "setuptools<81",
]
api = [
    "openai>=1.50",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
audiobook = "audiobook.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audiobook"]
