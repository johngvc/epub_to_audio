[book]
# Required for `audiobook assemble` unless overridden via --title/--author/--narrator.
title = ""
author = ""
narrator = ""
skip_sections = ["copyright", "dedication", "index", "bibliography"]

[adapt]
mode = "agent"
model_label = "claude-sonnet-4-6"
concurrency = 8
split_long_chapters_at_words = 6000
max_tokens_per_call = 8192
budget_usd = 15.0
prompt_cache = true

[chunk]
max_chars = 400
paragraph_silence_ms = 400
section_silence_ms = 1200

[render]
device = "mps"
workers = 2
exaggeration = 0.4
cfg_weight = 0.5
temperature = 0.7
multilingual = false

[assemble]
audio_bitrate_kbps = 64
sample_rate_hz = 24000
