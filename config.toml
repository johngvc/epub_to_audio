[book]
# Required for `audiobook assemble` unless overridden via --title/--author/--narrator.
title = ""
author = ""
narrator = ""
skip_sections = ["copyright", "dedication", "index", "bibliography"]

[adapt]
mode = "api"
model_label = "claude-sonnet-4-6"
concurrency = 8
split_long_chapters_at_words = 6000
max_tokens_per_call = 8192
budget_usd = 15.0
prompt_cache = true

[adapt.api]
# Local OpenAI-compatible server (LM Studio defaults).
# Override per-environment with OPENAI_BASE_URL / OPENAI_MODEL / OPENAI_API_KEY.
base_url = "http://localhost:1234/v1"
model = "qwen3.5-9b-mlx"       # LM Studio's loaded model
api_key = "lm-studio"          # LM Studio ignores this; sent to satisfy the SDK
context_window = 16384         # used to decide whether to include book_full_text.md
temperature = 0.3              # lower → more schema-compliant JSON
max_output_tokens = 8192       # caps a single response
request_timeout_s = 600        # generous; large chapters are slow on local GPU

[chunk]
max_chars = 400
paragraph_silence_ms = 400
section_silence_ms = 1200

[render]
device = "mps"
workers = 2
exaggeration = 0.4
cfg_weight = 0.5
temperature = 0.7
multilingual = false

[assemble]
audio_bitrate_kbps = 64
sample_rate_hz = 24000
